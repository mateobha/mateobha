name: Update profile README

# Refreshes the GitHub stats section and the contribution heatmap SVG.
# Runs daily, plus whenever you push to main, plus on-demand.

"on":
  schedule:
    - cron: "0 6 * * *"   # ~06:00 UTC every day
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh GitHub snapshot in README
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_readme.py

      - name: Render animated contribution heatmap SVG
        run: python scripts/generate_heatmap_svg.py "$GITHUB_REPOSITORY_OWNER" contrib-heatmap.svg

      - name: Commit updated README and heatmap
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh profile README and heatmap [skip ci]"
          file_pattern: "README.md contrib-heatmap.svg"
